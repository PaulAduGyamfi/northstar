<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Northstar: options</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #fff8f0;
        color: #1b1530;
        font: 14px "DM Sans", system-ui, sans-serif;
      }
      label {
        display: block;
        margin-top: 12px;
      }
      input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 8px 12px;
        border: 1px solid #f0e9df;
        border-radius: 14px;
        font: inherit;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        border: 0;
        border-radius: 999px;
        background: #ff5a4e;
        color: #1b1530;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <form id="options">
      <label for="apiOrigin">Northstar API address</label>
      <input id="apiOrigin" name="apiOrigin" type="url" required />
      <label for="token">Extension token</label>
      <input id="token" name="token" type="password" autocomplete="off" />
      <button type="submit">Save</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
