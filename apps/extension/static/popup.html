<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Northstar</title>
    <style>
      /* B · Momentum colors (docs/design/tokens.md). */
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        background: #fff8f0;
        color: #1b1530;
        font: 14px "DM Sans", system-ui, sans-serif;
      }
      button {
        width: 100%;
        padding: 10px 16px;
        border: 0;
        border-radius: 999px;
        background: #ff5a4e;
        color: #1b1530;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      p {
        margin: 12px 0 0;
        color: #6c6580;
      }
      hr {
        margin: 16px 0;
        border: 0;
        border-top: 1px solid #e8dfd3;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 700;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-bottom: 8px;
        padding: 8px;
        border: 1px solid #c9bfb2;
        border-radius: 8px;
        font: 12px ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <button id="save" type="button">Save to Northstar</button>
    <p id="status" role="status" aria-live="polite">Saves the job posting on this page.</p>
    <hr />
    <label for="code">Pre-fill code</label>
    <input id="code" type="password" autocomplete="off" spellcheck="false" />
    <button id="fill" type="button">Fill this form</button>
    <p id="fill-status" role="status" aria-live="polite">
      Paste the code from Needs your hands in Northstar, on the application's page. You submit it
      yourself.
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
