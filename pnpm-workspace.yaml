# Workspace packages (system-design §7). Each one arrives with the ticket that needs it.
packages:
  - "apps/*"
  - "packages/*"
  # Eval harness and per-route eval sets (NS-106, NFR-AIQ-001).
  - "evals"

# Refuse any release younger than 14 days (AGENTS.md cooldown against hijacked releases).
# 20160 minutes = 14 days. Never lower this to get an install through.
minimumReleaseAge: 20160

# No dependency may run an install script unless it's listed here (with Paul's approval).
# strictDepBuilds makes an unlisted one fail the install instead of being skipped quietly.
# esbuild (via drizzle-kit, dev only): its postinstall picks the native binary for this platform.
# Approved by Paul for NS-105 (specs/NS-105/spec.md, open question 5).
onlyBuiltDependencies:
  - esbuild
strictDepBuilds: true

# Install scripts that are skipped on purpose (they never run). Added under ADR-0016 for NS-157:
# @swc/core (Temporal's workflow bundler) only checks that its native binary, an ordinary
# optional dependency, is present; protobufjs (Temporal's gRPC types) only prints a version check.
ignoredBuiltDependencies:
  - "@swc/core"
  - protobufjs
