name: claude-review

# A Claude review of every pull request, seeing only the PR and the repo (an independent read,
# not the session that wrote the code). Needs the repository secret ANTHROPIC_API_KEY, which Paul
# adds in Settings → Secrets and variables → Actions.
#
# Public-repo safety: `pull_request` (never `pull_request_target`) means pull requests from forks
# run without secrets, and the job is skipped for them entirely.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read AGENTS.md, the spec under specs/ that the PR names, and the requirement IDs and ADRs it cites.
            Check, in order: correctness against the spec; tests and evals (none weakened);
            the approval gate (nothing outbound without a verified approval); provenance of generated
            text; idempotency and failure handling; events and spans emitted; secrets or personal data
            (the repo is public); scope creep.
            Post one review comment: Verdict, Critical, Should fix, Optional. Only real findings with file:line.
          claude_args: "--model claude-opus-5-5 --max-turns 20"
