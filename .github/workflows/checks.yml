name: checks

on:
  pull_request:
  # Runs the same checks on GitHub's merge queue, once Paul turns it on for main, so each queued PR
  # is tested on top of the latest main before it lands and PRs stop re-running after every merge.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # History and commit checks: gitleaks over the full history, pre-commit, harness hook tests.
  # Runs in parallel with `build` below.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gitleaks step below scans the full history
          # Don't leave the token in .git/config where dependency binaries could read it.
          persist-credentials: false

      # Third-party and Node actions pinned to a commit SHA (a tag can be moved; a SHA can't).
      # pnpm version comes from package.json "packageManager"; Node from .nvmrc.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Before pre-commit, so its Biome hook finds the locked binary in node_modules.
      # --frozen-lockfile fails if pnpm-lock.yaml doesn't match package.json.
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The pre-commit gitleaks hook only scans *staged* changes, so in CI it sees nothing.
      # Scan the whole git history here instead, so a commit made without the local hook
      # (--no-verify, or a clone without `pre-commit install`) still can't land a secret.
      # Same version as .pre-commit-config.yaml; checksum from the release's checksums.txt.
      - name: gitleaks on the full git history
        env:
          GITLEAKS_VERSION: 8.24.2
          GITLEAKS_SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      - name: Commit checks on every file (personal data, keys, large files)
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Harness hook self-tests
        run: bash .claude/hooks/test-hooks.sh

  # Lint, typecheck, test and build every package, the eval replay and the compose check.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Keep the downloaded Chromium between runs. The key follows the lock file, so a
      # playwright-core upgrade gets a fresh browser.
      - name: Cache Chromium for the form driver
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The Chromium build that matches the locked playwright-core (ADR-0028, NS-251), so the form
      # driver's real-browser test runs in CI. Tests serve synthetic pages through context.route
      # and touch no network themselves; only this install step downloads the browser (skipped
      # when the cache above already holds it; the system libraries are still installed).
      - name: Install Chromium for the form driver
        run: pnpm --filter @northstar/gateways exec playwright-core install --with-deps chromium

      # --force skips Turborepo's cache so CI always re-runs every check.
      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build --force

      # Replays every registered eval from its recorded fixtures and fails below baseline.json
      # (NFR-AIQ-001, ADR-0013). Offline, no API key, no cost. dist/ is already built above.
      - name: Evals (replay)
        working-directory: evals
        run: node dist/bin.js --all

      # Validates docker-compose.yml (syntax, required variables) with the placeholder values.
      # CI doesn't run the stack.
      - name: Compose file is valid
        run: docker compose --env-file .env.example config --quiet

  # The one required status check (branch protection names `checks`). It passes only when both
  # jobs above succeeded: a failed, cancelled or skipped job fails it, so splitting the work into
  # parallel jobs can never let a red check through.
  checks:
    runs-on: ubuntu-latest
    needs: [scan, build]
    if: always()
    steps:
      - name: Both scan and build succeeded
        env:
          SCAN: ${{ needs.scan.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "scan: $SCAN, build: $BUILD"
          test "$SCAN" = "success" && test "$BUILD" = "success"
