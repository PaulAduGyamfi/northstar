version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14 # wait two weeks after a release (AGENTS.md: 14-day rule)
    groups:
      actions:
        patterns: ["*"]

