version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14 # wait two weeks after a release (AGENTS.md: 14-day rule)
    groups:
      actions:
        patterns: ["*"]

  # npm covers pnpm workspaces (it reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14 # same 14-day rule as pnpm's minimumReleaseAge
    groups:
      npm:
        patterns: ["*"]

  # Images in docker-compose.yml (pinned by tag@digest).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14 # same 14-day rule
    groups:
      images:
        patterns: ["*"]
